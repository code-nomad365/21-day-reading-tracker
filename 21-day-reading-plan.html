<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5ee">
  <meta name="description" content="21 天養成洗澡後閱讀 15 分鐘的習慣行動計畫。">
  <title>21 天養成閱讀習慣計畫</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", sans-serif; color: #243b35; background: #f7f5ee; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    main { width: min(100% - 24px, 980px); margin: 0 auto; padding: 24px 0 40px; }
    header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 4px 16px; }
    h1 { margin: 0; font-size: clamp(20px, 5vw, 28px); letter-spacing: -.03em; }
    p { margin: 0; color: #718078; font-size: 13px; }
    figure { margin: 0; overflow: hidden; border: 1px solid #e8e5dc; border-radius: 18px; background: #fff; box-shadow: 0 14px 36px rgba(42, 66, 53, .08); }
    img { display: block; width: 100%; height: auto; }
    figcaption { padding: 12px 16px; color: #718078; font-size: 12px; text-align: center; }
    @media (max-width: 540px) {
      main { width: min(100% - 16px, 980px); padding-top: 14px; }
      header { align-items: flex-start; flex-direction: column; gap: 3px; margin-bottom: 10px; }
      figure { border-radius: 13px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>21 天養成閱讀習慣計畫</h1>
      <p>洗澡後閱讀 15 分鐘，完成後再享受影片。</p>
    </header>
    <figure>
      <img src="21-day-reading-plan.png" alt="21 天養成洗澡後閱讀 15 分鐘習慣的行動計畫資訊圖" width="944" height="1672" fetchpriority="high">
      <figcaption>21 天閱讀習慣行動計畫</figcaption>
    </figure>
  </main>
</body>
</html>
